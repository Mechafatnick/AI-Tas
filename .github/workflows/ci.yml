name: RTL CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator make

      - name: Verify repository is self-contained
        run: python3 tools/check_self_contained.py

      - name: Run RTL unit tests
        run: make -j2 test
